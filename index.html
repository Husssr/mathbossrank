                                <i className="fas fa-shield-halved text-yellow-400"></i> รายละเอียดแรงค์
                            </h1>
                            <p className="text-gray-400 mb-8 text-sm md:text-base">สะสมคะแนนเพื่อไต่แรงค์ให้สูงขึ้น แล้วเป็นแรงบันดาลใจให้เพื่อนๆ!</p>
                            <RankDetailBoard students={students} />
                        </div>
                    )}
                </div>
            );
        };

        const TeacherDashboard = ({ students, saveStudents, syncState, saveSync }) => {
            const [activeTab, setActiveTab] = useState('control');
            const [questionMode, setQuestionMode] = useState('auto'); // 'auto' or 'manual'
            const [previewQ, setPreviewQ] = useState(null);
            
            // Question Controls
            const [targetGrade, setTargetGrade] = useState('ป.1');
            const [targetDiff, setTargetDiff] = useState('ง่าย');
            const [timeLimit, setTimeLimit] = useState(15);

            // Manual Question Inputs
            const [manualQ, setManualQ] = useState('');
            const [manualAns, setManualAns] = useState('');
            const [manualStep, setManualStep] = useState('');

            // Rank Detail View (also mirrors to the projector screen)
            const [showRankDetail, setShowRankDetail] = useState(false);

            // Student Form & Bulk Import
            const [gradeFilter, setGradeFilter] = useState('ทั้งหมด');
            const [newStName, setNewStName] = useState('');
            const [newStGrade, setNewStGrade] = useState('ป.1');
            const [bulkNames, setBulkNames] = useState('');
            const [showBulkModal, setShowBulkModal] = useState(false);

            // Modals & Toasts
            const [modal, setModal] = useState({ isOpen: false, title: '', msg: '', onConfirm: null });
            const [toast, setToast] = useState({ isVisible: false, msg: '' });
            const [deductState, setDeductState] = useState({ isOpen: false, studentId: null, studentName: '', pointsToDeduct: 1 });
            const [addPointState, setAddPointState] = useState({ isOpen: false, studentId: null, studentName: '', pointsToAdd: 1 });

            // Activity Log
            const [logs, setLogs] = useState([]);

            const addLog = (text) => {
                const timeStr = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                setLogs(prev => [{ id: Date.now(), text, time: timeStr }, ...prev].slice(0, 10));
            };

            const showToast = (msg) => {
                setToast({ isVisible: true, msg });
                setTimeout(() => setToast({ isVisible: false, msg: '' }), 3000);
            };

            const confirmAction = (title, msg, onConfirm) => {
                setModal({ isOpen: true, title, msg, onConfirm });
            };

            // Keyboard Shortcuts
            useEffect(() => {
                const handleKeyDown = (e) => {
                    const tag = e.target.tagName;
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

                    if (e.key === 'Shift') {
                        e.preventDefault();
                        if (activeTab !== 'control') setActiveTab('control');
                        handlePreview();
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        if (activeTab !== 'control') setActiveTab('control');
                        handleSendToProjector();
                    } else if (e.code === 'Space') {
                        e.preventDefault();
                        if (activeTab !== 'control') setActiveTab('control');
                        handleTogglePause();
                    } else if (e.code === 'KeyA') {
                        e.preventDefault();
                        if (activeTab !== 'control') setActiveTab('control');
                        handleShowAnswer();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            });

            // Handlers
            const handlePreview = () => {
                if (questionMode === 'auto') {
                    const generated = generateEquation(targetGrade, targetDiff);
                    let recPoints = 1;
                    if (targetDiff === 'ปานกลาง' || targetDiff === 'ยาก') recPoints = 3;
                    if (targetDiff === 'ยากมาก') recPoints = 5;
                    setPreviewQ({ ...generated, recommendedPoints: recPoints, isSent: false });
                } else {
                    if (!manualQ.trim() || !manualAns.trim()) {
                        showToast("กรุณากรอกโจทย์และเฉลยคำตอบ!");
                        return;
                    }
                    const steps = manualStep.trim() ? manualStep.split('\n').filter(s => s.trim()) : [`เฉลยคำตอบ: ${manualAns}`];
                    setPreviewQ({
                        question: manualQ,
                        answer: manualAns,
                        steps: steps,
                        recommendedPoints: 2,
                        isSent: false
                    });
                }
            };

            const handleSendToProjector = () => {
                if (!previewQ) return;
                let customTime = parseInt(timeLimit);
                if (isNaN(customTime) || customTime <= 0) customTime = 15;

                saveSync({
                    ...syncState,
                    view: 'question',
                    questionData: {
                        question: previewQ.question,
                        answer: previewQ.answer,
                        steps: previewQ.steps,
                        timeLeft: customTime,
                        isPaused: false,
                        showAnswer: false,
                        timestamp: Date.now()
                    }
                });
                setPreviewQ({ ...previewQ, isSent: true });
                showToast("ส่งโจทย์ขึ้นจอโปรเจคเตอร์แล้ว!");
                addLog(`ส่งโจทย์: ${previewQ.question}`);
            };

            const handleTogglePause = () => {
                if (syncState.view === 'question' && syncState.questionData) {
                    const paused = !syncState.questionData.isPaused;
                    saveSync({
                        ...syncState,
                        questionData: { ...syncState.questionData, isPaused: paused }
                    });
                    showToast(paused ? "หยุดเวลาแล้ว" : "เริ่มเดินเวลาต่อ");
                }
            };

            const handleShowAnswer = () => {
                if (syncState.view === 'question' && syncState.questionData) {
                    saveSync({
                        ...syncState,
                        questionData: { ...syncState.questionData, showAnswer: true, isPaused: true }
                    });
                    showToast("แสดงเฉลยบนโปรเจคเตอร์แล้ว!");
                }
            };

            const addPoints = (id, points) => {
                const updated = students.map(st => {
                    if (st.id === id) {
                        const newStats = { ...st.stats };
                        newStats.totalQuestions = (newStats.totalQuestions || 0) + 1;
                        if(points === 1) newStats.plus1 = (newStats.plus1 || 0) + 1;
                        if(points === 3) newStats.plus3 = (newStats.plus3 || 0) + 1;
                        if(points === 5) newStats.plus5 = (newStats.plus5 || 0) + 1;
                        if(points === 10) newStats.plus10 = (newStats.plus10 || 0) + 1;
                        addLog(`บวกคะแนนให้ ${st.name} (+${points})`);
                        return { ...st, score: st.score + points, stats: newStats };
                    }
                    return st;
                });
                saveStudents(updated);
                showToast(`บวก +${points} ให้สำเร็จ!`);
            };

            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!newStName.trim()) return;
                const newStudent = {
                    id: Date.now().toString(),
                    name: newStName,
                    grade: newStGrade,
                    score: 0,
                    stats: { totalQuestions: 0, plus1: 0, plus3: 0, plus5: 0, plus10: 0 }
                };
                saveStudents([...students, newStudent]);
                setNewStName('');
                showToast("เพิ่มนักเรียนสำเร็จ!");
            };

            const handleBulkAdd = () => {
                const names = bulkNames.split('\n').map(n => n.trim()).filter(n => n.length > 0);
                if (names.length === 0) return;

                const newStudents = names.map((name, i) => ({
                    id: (Date.now() + i).toString(),
                    name,
                    grade: newStGrade,
                    score: 0,
                    stats: { totalQuestions: 0, plus1: 0, plus3: 0, plus5: 0, plus10: 0 }
                }));

                saveStudents([...students, ...newStudents]);
                setBulkNames('');
                setShowBulkModal(false);
                showToast(`เพิ่มรายชื่อสำเร็จ ${names.length} คน!`);
            };

            const exportCSV = () => {
                let csvContent = "data:text/csv;charset=utf-8,ชื่อ,ชั้น,คะแนน,โจทย์ทั้งหมด\n";
                students.forEach(s => {
                    csvContent += `"${s.name}","${s.grade}",${s.score},${s.stats?.totalQuestions || 0}\n`;
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Math_Boss_Rank_Export_${Date.now()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleDeductConfirm = () => {
                const updated = students.map(st => {
                    if (st.id === deductState.studentId) {
                        let newScore = Math.max(0, st.score - deductState.pointsToDeduct);
                        return { ...st, score: newScore };
                    }
                    return st;
                });
                saveStudents(updated);
                showToast(`ลบคะแนน ${deductState.studentName} ออก ${deductState.pointsToDeduct} คะแนน`);
                setDeductState({ isOpen: false, studentId: null, studentName: '', pointsToDeduct: 1 });
            };

            const handleAddPointConfirm = () => {
                const updated = students.map(st => {
                    if (st.id === addPointState.studentId) {
                        return { ...st, score: st.score + addPointState.pointsToAdd };
                    }
                    return st;
                });
                saveStudents(updated);
                showToast(`เพิ่มคะแนนให้ ${addPointState.studentName} +${addPointState.pointsToAdd} คะแนน`);
                setAddPointState({ isOpen: false, studentId: null, studentName: '', pointsToAdd: 1 });
            };

            const changeTheme = (themeName) => {
                saveSync({ ...syncState, theme: themeName });
                showToast("เปลี่ยนธีมฉากหลังโปรเจคเตอร์แล้ว");
            };

            const openProjector = () => {
                window.open(window.location.pathname + '?projector=true', 'ProjectorWindow', 'width=1280,height=720');
            };

            const gradesList = ['ป.1', 'ป.2', 'ป.3', 'ป.4', 'ป.5', 'ป.6'];
            const filteredStudents = gradeFilter === 'ทั้งหมด' ? students : students.filter(s => s.grade === gradeFilter);

            return (
                <div className="min-h-screen flex flex-col bg-slate-900 text-white">
                    {/* Top Control Bar */}
                    <header className="bg-slate-800 p-4 border-b border-slate-700 flex flex-wrap justify-between items-center gap-4 shadow-md">
                        <div className="flex flex-wrap gap-2">
                            <button onClick={() => setActiveTab('control')} className={`px-5 py-2 rounded-lg font-bold transition-all ${activeTab === 'control' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-gray-300 hover:bg-slate-600'}`}>
                                <i className="fas fa-gamepad mr-2"></i>ควบคุมเกม
                            </button>
                            <button onClick={() => { setActiveTab('rank'); setShowRankDetail(false); saveSync({...syncState, view: 'rank'}); }} className={`px-5 py-2 rounded-lg font-bold transition-all ${activeTab === 'rank' ? 'bg-yellow-500 text-black' : 'bg-slate-700 text-gray-300 hover:bg-slate-600'}`}>
                                <i className="fas fa-trophy mr-2"></i>แรงค์คะแนน
                            </button>
                            <button onClick={() => setActiveTab('students')} className={`px-5 py-2 rounded-lg font-bold transition-all ${activeTab === 'students' ? 'bg-green-600 text-white' : 'bg-slate-700 text-gray-300 hover:bg-slate-600'}`}>
                                <i className="fas fa-users mr-2"></i>นักเรียน ({students.length})
                            </button>
                        </div>

                        <div className="flex items-center gap-3">
                            <select onChange={(e) => changeTheme(e.target.value)} className="bg-slate-700 text-xs p-2 rounded-lg font-bold outline-none border border-slate-600">
                                <option value="bg-theme-cosmic">ธีม: Cosmic Blue</option>
                                <option value="bg-theme-cyberpunk">ธีม: Cyberpunk Purple</option>
                                <option value="bg-theme-emerald">ธีม: Emerald Forest</option>
                                <option value="bg-theme-sunset">ธีม: Sunset Gold</option>
                                <option value="bg-theme-freefire">ธีม: Free Fire Battle</option>
                            </select>
                            <button onClick={openProjector} className="px-5 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg font-bold shadow-lg flex items-center transition-transform active:scale-95 text-sm">
                                <i className="fas fa-external-link-alt mr-2"></i>เปิดจอโปรเจคเตอร์
                            </button>
                        </div>
                    </header>

                    {/* Main Content Dashboard */}
                    <main className="flex-1 p-6 overflow-auto">
                        
                        {/* TAB: CONTROL */}
                        {activeTab === 'control' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* Left Panel: Question Builder */}
                                <div className="lg:col-span-2 flex flex-col gap-6">
                                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                        <div className="flex justify-between items-center mb-4">
                                            <div className="flex gap-2 bg-slate-900 p-1 rounded-lg">
                                                <button onClick={() => setQuestionMode('auto')} className={`px-4 py-1.5 rounded-md font-bold text-xs ${questionMode === 'auto' ? 'bg-blue-600 text-white' : 'text-gray-400'}`}>
                                                    <i className="fas fa-magic mr-1"></i>สุ่มโจทย์อัตโนมัติ
                                                </button>
                                                <button onClick={() => setQuestionMode('manual')} className={`px-4 py-1.5 rounded-md font-bold text-xs ${questionMode === 'manual' ? 'bg-blue-600 text-white' : 'text-gray-400'}`}>
                                                    <i className="fas fa-pen mr-1"></i>กำหนดโจทย์เอง
                                                </button>
                                            </div>
                                        </div>

                                        {questionMode === 'auto' ? (
                                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-4">
                                                <div>
                                                    <label className="text-xs text-gray-400 block mb-1">ระดับชั้น</label>
                                                    <select value={targetGrade} onChange={(e) => setTargetGrade(e.target.value)} className="w-full bg-slate-700 p-2.5 rounded-lg border-none font-bold outline-none">
                                                        {gradesList.map(g => <option key={g} value={g}>{g}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-400 block mb-1">ความยาก</label>
                                                    <select value={targetDiff} onChange={(e) => setTargetDiff(e.target.value)} className="w-full bg-slate-700 p-2.5 rounded-lg border-none font-bold outline-none">
                                                        <option value="ง่าย">ง่าย</option>
                                                        <option value="ปานกลาง">ปานกลาง</option>
                                                        <option value="ยาก">ยาก</option>
                                                        <option value="ยากมาก">ยากมาก</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-400 block mb-1">เวลา (วินาที)</label>
                                                    <input type="number" min="1" value={timeLimit} onChange={(e) => setTimeLimit(e.target.value)} className="w-full bg-slate-700 p-2.5 rounded-lg font-bold text-center outline-none" />
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="flex flex-col gap-3 mb-4">
                                                <input type="text" placeholder="พิมพ์โจทย์คำถาม เช่น 25 + 18 หรือ โจทย์ปัญหา..." value={manualQ} onChange={(e) => setManualQ(e.target.value)} className="bg-slate-700 p-2.5 rounded-lg outline-none font-bold" />
                                                <div className="grid grid-cols-2 gap-3">
                                                    <input type="text" placeholder="เฉลยคำตอบ เช่น 43" value={manualAns} onChange={(e) => setManualAns(e.target.value)} className="bg-slate-700 p-2.5 rounded-lg outline-none font-bold text-green-400" />
                                                    <input type="number" min="1" value={timeLimit} onChange={(e) => setTimeLimit(e.target.value)} placeholder="เวลา (วินาที)" className="bg-slate-700 p-2.5 rounded-lg font-bold text-center outline-none" />
                                                </div>
                                                <textarea placeholder="วิธีทำ step-by-step (ขึ้นบรรทัดใหม่สำหรับแต่ละขั้น)" value={manualStep} onChange={(e) => setManualStep(e.target.value)} className="bg-slate-700 p-2.5 rounded-lg text-xs h-16 outline-none resize-none"></textarea>
                                            </div>
                                        )}

                                        {/* Action Buttons */}
                                        <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-700">
                                            <button onClick={handlePreview} className="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-lg font-bold shadow transition-transform active:scale-95 text-sm flex flex-col items-center">
                                                <span><i className="fas fa-dice mr-1"></i>พรีวิวโจทย์</span>
                                                <span className="text-[10px] text-blue-200 opacity-70">(Shift)</span>
                                            </button>
                                            <button onClick={handleSendToProjector} disabled={!previewQ} className={`flex-1 py-2.5 rounded-lg font-bold shadow transition-all active:scale-95 text-sm flex flex-col items-center ${previewQ ? 'bg-green-500 hover:bg-green-400 text-white' : 'bg-slate-700 text-gray-500 cursor-not-allowed'}`}>
                                                <span><i className="fas fa-paper-plane mr-1"></i>ส่งขึ้นจอ</span>
                                                <span className="text-[10px] opacity-70">(Enter)</span>
                                            </button>
                                            <button onClick={handleTogglePause} className="flex-1 bg-orange-500 hover:bg-orange-400 py-2.5 rounded-lg font-bold shadow transition-transform active:scale-95 text-sm flex flex-col items-center">
                                                <span><i className="fas fa-pause mr-1"></i>หยุด/เดินเวลา</span>
                                                <span className="text-[10px] text-orange-200 opacity-70">(Space)</span>
                                            </button>
                                            <button onClick={handleShowAnswer} className="flex-1 bg-purple-600 hover:bg-purple-500 py-2.5 rounded-lg font-bold shadow transition-transform active:scale-95 text-sm flex flex-col items-center">
                                                <span><i className="fas fa-magic mr-1"></i>เฉลยโจทย์</span>
                                                <span className="text-[10px] text-purple-200 opacity-70">(ปุ่ม A)</span>
                                            </button>
                                        </div>

                                        {/* Preview Display Box */}
                                        <div className="mt-4 bg-slate-900 rounded-xl p-5 flex flex-col items-center justify-center min-h-[120px] border-2 border-dashed border-slate-600 relative shadow-inner">
                                            {previewQ ? (
                                                <>
                                                    {previewQ.isSent ? (
                                                        <div className="absolute top-2 left-2 bg-green-500/20 text-green-400 text-[10px] px-2.5 py-0.5 rounded-full font-bold border border-green-500/50"><i className="fas fa-broadcast-tower mr-1"></i>แสดงบนจอแล้ว</div>
                                                    ) : (
                                                        <div className="absolute top-2 left-2 bg-yellow-500/20 text-yellow-400 text-[10px] px-2.5 py-0.5 rounded-full font-bold border border-yellow-500/50"><i className="fas fa-eye mr-1"></i>พรีวิว (ครูเห็นคนเดียว)</div>
                                                    )}
                                                    <div className="text-3xl font-bold text-white my-3">{previewQ.question} = <span className="text-green-400">{previewQ.answer}</span></div>
                                                    <div className="text-xs text-gray-400 bg-slate-800 p-2.5 rounded-lg border border-slate-700 w-full">
                                                        <div className="text-yellow-400 mb-1 font-bold">วิธีทำ:</div>
                                                        {previewQ.steps.map((s, i) => <div key={i} className="text-gray-300 ml-2">• {s}</div>)}
                                                    </div>
                                                </>
                                            ) : (
                                                <div className="text-gray-500 text-sm flex flex-col items-center">
                                                    <i className="fas fa-chalkboard text-3xl mb-2 opacity-40"></i>
                                                    <span>กดปุ่ม "พรีวิวโจทย์" เพื่อเริ่มสร้างข้อสอบ</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* Score Awarding Grid */}
                                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg flex-1">
                                        <h2 className="text-lg font-bold mb-4 flex justify-between items-center">
                                            <span><i className="fas fa-star text-yellow-400 mr-2"></i>กระดานให้คะแนนนักเรียน</span>
                                            <span className="text-xs font-normal text-gray-400">คลิกที่ปุ่มเพื่อเพิ่มคะแนนทันที</span>
                                        </h2>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                            {students.map(st => {
                                                const rank = getRankInfo(st.score);
                                                return (
                                                    <div key={st.id} className="bg-slate-700/80 p-3 rounded-xl border border-slate-600 flex flex-col items-center shadow">
                                                        <div className="text-sm font-bold truncate w-full text-center">{st.name}</div>
                                                        <div className="text-[10px] text-gray-400 mb-1">ชั้น {st.grade}</div>
                                                        <div className={`px-2 py-0.5 rounded-full text-[10px] font-bold mb-2 border flex items-center gap-1 ${rank.bg} ${rank.text}`}>
                                                            {rank.name} ({st.score})
                                                        </div>
                                                        <div className="grid grid-cols-4 gap-1 w-full">
                                                            <button onClick={() => addPoints(st.id, 1)} className="bg-blue-600 hover:bg-blue-500 py-1 rounded text-xs font-bold shadow">+1</button>
                                                            <button onClick={() => addPoints(st.id, 3)} className="bg-green-600 hover:bg-green-500 py-1 rounded text-xs font-bold shadow">+3</button>
                                                            <button onClick={() => addPoints(st.id, 5)} className="bg-purple-600 hover:bg-purple-500 py-1 rounded text-xs font-bold shadow">+5</button>
                                                            <button onClick={() => addPoints(st.id, 10)} className="bg-red-600 hover:bg-red-500 py-1 rounded text-xs font-bold shadow">+10</button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                {/* Right Panel: Recent Activity Log */}
                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg h-full flex flex-col">
                                    <h3 className="text-md font-bold mb-4 flex items-center text-gray-300">
                                        <i className="fas fa-history mr-2 text-blue-400"></i>ประวัติการให้คะแนนล่าสุด
                                    </h3>
                                    <div className="flex-1 overflow-y-auto flex flex-col gap-2 pr-1 no-scrollbar min-h-[300px]">
                                        {logs.map(log => (                                            <div key={log.id} className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/60 text-xs flex justify-between items-center">
                                                <span className="text-gray-200">{log.text}</span>
                                                <span className="text-[10px] text-gray-500">{log.time}</span>
                                            </div>
                                        ))}
                                        {logs.length === 0 && (
                                            <div className="text-center text-gray-500 text-xs py-10">ยังไม่มีประวัติกิจกรรม</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB: RANK */}
                        {activeTab === 'rank' && (
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                <div className="flex flex-wrap justify-between items-center gap-4 mb-6">
                                    <h2 className="text-2xl font-bold"><i className="fas fa-list-ol text-yellow-400 mr-2"></i>กระดานอันดับนักเรียน</h2>
                                    <div className="flex flex-wrap gap-2">
                                        <button onClick={() => {
                                            const next = !showRankDetail;
                                            setShowRankDetail(next);
                                            saveSync({ ...syncState, view: next ? 'rankDetail' : 'rank' });
                                            showToast(next ? "แสดงรายละเอียดแรงค์บนจอโปรเจคเตอร์แล้ว!" : "กลับไปหน้ากระดานอันดับ");
                                        }} className={`px-4 py-2 rounded-lg font-bold text-sm shadow flex items-center transition-transform active:scale-95 ${showRankDetail ? 'bg-yellow-500 text-black' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}>
                                            <i className="fas fa-shield-halved mr-1"></i>{showRankDetail ? 'ปิดรายละเอียดแรงค์' : 'ดูรายละเอียดแรงค์'}
                                        </button>
                                        <button onClick={exportCSV} className="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-bold text-sm shadow">
                                            <i className="fas fa-file-excel mr-1"></i>ส่งออก CSV
                                        </button>
                                        <select value={gradeFilter} onChange={(e) => setGradeFilter(e.target.value)} className="bg-slate-700 p-2 rounded-lg text-sm font-bold outline-none">
                                            <option value="ทั้งหมด">ทุกชั้นเรียน</option>
                                            {gradesList.map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                    </div>
                                </div>

                                {showRankDetail && (
                                    <div className="mb-6 p-4 md:p-6 bg-slate-900/60 rounded-2xl border border-slate-700">
                                        <p className="text-xs text-gray-400 mb-4"><i className="fas fa-tv mr-1"></i>กำลังแสดงหน้านี้บนจอโปรเจคเตอร์ที่นักเรียนเห็นอยู่ด้วย</p>
                                        <RankDetailBoard students={students} />
                                    </div>
                                )}

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-900 border-b border-slate-700 text-xs text-gray-400 uppercase">
                                                <th className="p-3">อันดับ</th>
                                                <th className="p-3">ชื่อ - นามสกุล</th>
                                                <th className="p-3">ชั้น</th>
                                                <th className="p-3 text-center">ทำโจทย์ไป (ข้อ)</th>
                                                <th className="p-3">แรงค์ปัจจุบัน</th>
                                                <th className="p-3 text-right">คะแนนรวม</th>
                                                <th className="p-3 text-center">จัดการคะแนน</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredStudents.sort((a,b) => b.score - a.score).map((st, i) => {
                                                const rank = getRankInfo(st.score);
                                                return (
                                                    <tr key={st.id} className="border-b border-slate-700/50 hover:bg-slate-700/30 text-sm">
                                                        <td className="p-3 font-bold">{i+1}</td>
                                                        <td className="p-3 font-bold">{st.name}</td>
                                                        <td className="p-3 text-gray-400">{st.grade}</td>
                                                        <td className="p-3 text-center font-bold">{st.stats?.totalQuestions || 0}</td>
                                                        <td className="p-3">
                                                            <span className={`px-2.5 py-1 rounded-full text-xs font-bold border flex items-center w-fit gap-1 ${rank.bg} ${rank.text}`}>
                                                                <RankIcon name={rank.name} className="w-4 h-4" /> {rank.name}
                                                            </span>
                                                        </td>
                                                        <td className="p-3 text-right font-black text-lg text-blue-400">{st.score}</td>
                                                        <td className="p-3 text-center flex justify-center gap-2">
                                                            <button onClick={() => setAddPointState({ isOpen: true, studentId: st.id, studentName: st.name, pointsToAdd: 1 })} className="bg-green-500/20 hover:bg-green-500/40 text-green-400 px-3 py-1 rounded text-xs font-bold">
                                                                + เพิ่ม
                                                            </button>
                                                            <button onClick={() => setDeductState({ isOpen: true, studentId: st.id, studentName: st.name, pointsToDeduct: 1 })} className="bg-red-500/20 hover:bg-red-500/40 text-red-400 px-3 py-1 rounded text-xs font-bold">
                                                                - ลบ
                                                            </button>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* TAB: STUDENTS */}
                        {activeTab === 'students' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg col-span-1 h-fit">
                                    <h2 className="text-lg font-bold mb-4">เพิ่มรายชื่อนักเรียน</h2>
                                    <form onSubmit={handleAddStudent} className="flex flex-col gap-3">
                                        <input type="text" placeholder="ชื่อ-นามสกุล หรือ ชื่อเล่น" value={newStName} onChange={(e) => setNewStName(e.target.value)} className="bg-slate-700 p-2.5 rounded-lg outline-none text-sm font-bold" required />
                                        <select value={newStGrade} onChange={(e) => setNewStGrade(e.target.value)} className="bg-slate-700 p-2.5 rounded-lg outline-none text-sm font-bold">
                                            {gradesList.map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                        <button type="submit" className="bg-blue-600 hover:bg-blue-500 p-2.5 rounded-lg font-bold shadow text-sm">เพิ่ม 1 คน</button>
                                    </form>

                                    <button onClick={() => setShowBulkModal(true)} className="w-full mt-4 bg-purple-600 hover:bg-purple-500 p-2.5 rounded-lg font-bold shadow text-sm flex items-center justify-center">
                                        <i className="fas fa-users-line mr-2"></i>นำเข้ารายชื่อหลายคน (Bulk)
                                    </button>
                                </div>

                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg col-span-1 md:col-span-2">
                                    <h2 className="text-lg font-bold mb-4">รายชื่อทั้งหมด ({students.length} คน)</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[60vh] overflow-y-auto">
                                        {students.map(st => (
                                            <div key={st.id} className="bg-slate-700/80 p-3 rounded-lg flex justify-between items-center border border-slate-600">
                                                <div>
                                                    <div className="font-bold text-sm">{st.name}</div>
                                                    <div className="text-xs text-gray-400">ชั้น {st.grade}</div>
                                                </div>
                                                <button onClick={() => {
                                                    confirmAction("ลบนกเรียน", `ยืนยันการลบ ${st.name}?`, () => {
                                                        saveStudents(students.filter(s => s.id !== st.id));
                                                        showToast("ลบเรียบร้อยแล้ว");
                                                    });
                                                }} className="text-red-400 hover:text-red-300 p-2">
                                                    <i className="fas fa-trash-alt"></i>
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB: PETS */}
                        {activeTab === 'pets' && (
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                <div className="text-center mb-8">
                                    <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 flex items-center justify-center gap-3">
                                        <i className="fas fa-paw text-pink-500"></i> สัตว์เลี้ยงประจำแรงค์
                                    </h2>
                                    <p className="text-gray-400 text-sm mt-1">สัตว์เลี้ยงจะคู่กับแรงค์ของนักเรียนเพื่อเพิ่มความสนุกสนานในการสะสม</p>
                                </div>

                                <div className="flex flex-col gap-6">
                                    {[
                                        { score: 800, req: "800+" },
                                        { score: 550, req: "550 - 799" },
                                        { score: 350, req: "350 - 549" },
                                        { score: 200, req: "200 - 349" },
                                        { score: 100, req: "100 - 199" },
                                        { score: 50,  req: "50 - 99" },
                                        { score: 20,  req: "20 - 49" },
                                        { score: 0,   req: "0 - 19" }
                                    ].map((item) => {
                                        const rank = getRankInfo(item.score);
                                        const pet = rank.pet;
                                        return (
                                            <div key={item.score} className={`bg-slate-900/60 rounded-xl p-5 border ${rank.border} flex flex-col md:flex-row items-center gap-6`}>
                                                <div className="flex flex-col items-center min-w-[180px]">
                                                    <div className={`px-3 py-1 rounded-full font-bold text-xs border flex items-center gap-2 mb-3 ${rank.bg} ${rank.text}`}>
                                                        <RankIcon name={rank.name} className="w-5 h-5" /> {rank.name}
                                                    </div>
                                                    <div className="relative w-28 h-28 flex items-center justify-center bg-black/40 rounded-full border-2" style={{borderColor: pet.badgeColor}}>
                                                        <i className={`fas ${pet.icon} text-5xl relative z-10 animate-bounce`} style={{color: pet.iconColor}}></i>
                                                    </div>
                                                    <div className="mt-2 font-black text-lg" style={{color: pet.iconColor}}>{pet.name}</div>
                                                </div>

                                                <div className="flex-1 w-full">
                                                    <div className="text-sm font-bold text-yellow-400 mb-2">คะแนนที่ต้องใช้: {item.req} คะแนน</div>
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
                                                        {pet.stats.map((st, i) => (
                                                            <div key={i} className="flex items-center gap-2 bg-slate-800/60 p-2 rounded border border-slate-700/50 text-xs">
                                                                <i className={`fas ${st.i}`} style={{color: st.c}}></i>
                                                                <span className="text-gray-300">{st.t}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    <div className="italic text-xs text-gray-400 bg-black/30 p-2 rounded text-center">{pet.quote}</div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Bulk Add Modal */}
                    {showBulkModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-md w-full shadow-2xl">
                                <h3 className="text-lg font-bold mb-2">นำเข้ารายชื่อนักเรียนหลายคน</h3>
                                <p className="text-xs text-gray-400 mb-4">พิมพ์หรือวางรายชื่อนักเรียนลงในช่องด้านล่าง (1 คนต่อ 1 บรรทัด)</p>
                                <textarea value={bulkNames} onChange={(e) => setBulkNames(e.target.value)} placeholder="ด.ช. สมชาย ใจดี&#10;ด.ญ. สมหญิง รักเรียน&#10;..." className="w-full h-40 bg-slate-900 p-3 rounded-lg border border-slate-700 text-sm outline-none resize-none mb-4 font-mono"></textarea>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setShowBulkModal(false)} className="px-4 py-2 bg-gray-600 rounded-lg text-xs font-bold">ยกเลิก</button>
                                    <button onClick={handleBulkAdd} className="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-lg text-xs font-bold">ยืนยันนำเข้า</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add / Deduct Modals */}
                    {addPointState.isOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-xs w-full">
                                <h3 className="text-lg font-bold text-green-400 mb-2">เพิ่มคะแนนพิเศษ</h3>
                                <p className="text-xs text-gray-300 mb-4">นักเรียน: <strong>{addPointState.studentName}</strong></p>
                                <input type="number" min="1" value={addPointState.pointsToAdd} onChange={(e) => setAddPointState({...addPointState, pointsToAdd: parseInt(e.target.value) || 0})} className="w-full bg-slate-900 p-2.5 rounded-lg text-center font-bold text-xl mb-4 outline-none border border-slate-600" />
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setAddPointState({isOpen: false, studentId: null, studentName: '', pointsToAdd: 1})} className="px-3 py-1.5 bg-gray-600 rounded text-xs font-bold">ยกเลิก</button>
                                    <button onClick={handleAddPointConfirm} className="px-3 py-1.5 bg-green-600 rounded text-xs font-bold">ยืนยัน</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {deductState.isOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-xs w-full">
                                <h3 className="text-lg font-bold text-red-400 mb-2">ลบคะแนน</h3>
                                <p className="text-xs text-gray-300 mb-4">นักเรียน: <strong>{deductState.studentName}</strong></p>
                                <input type="number" min="1" value={deductState.pointsToDeduct} onChange={(e) => setDeductState({...deductState, pointsToDeduct: parseInt(e.target.value) || 0})} className="w-full bg-slate-900 p-2.5 rounded-lg text-center font-bold text-xl mb-4 outline-none border border-slate-600" />
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setDeductState({isOpen: false, studentId: null, studentName: '', pointsToDeduct: 1})} className="px-3 py-1.5 bg-gray-600 rounded text-xs font-bold">ยกเลิก</button>
                                    <button onClick={handleDeductConfirm} className="px-3 py-1.5 bg-red-600 rounded text-xs font-bold">ยืนยันลบ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Generic Confirmation Modal */}
                    {modal.isOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-xs w-full">
                                <h3 className="text-lg font-bold mb-2">{modal.title}</h3>
                                <p className="text-xs text-gray-300 mb-4">{modal.msg}</p>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setModal({isOpen: false, title:'', msg:'', onConfirm:null})} className="px-3 py-1.5 bg-gray-600 rounded text-xs font-bold">ยกเลิก</button>
                                    <button onClick={() => { modal.onConfirm(); setModal({isOpen: false, title:'', msg:'', onConfirm:null}); }} className="px-3 py-1.5 bg-red-600 rounded text-xs font-bold">ตกลง</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Alert */}
                    {toast.isVisible && (
                        <div className="fixed bottom-6 right-6 bg-emerald-500 text-white px-5 py-2.5 rounded-xl shadow-2xl font-bold flex items-center gap-2 z-50 animate-bounce text-sm">
                            <i className="fas fa-check-circle"></i> {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const isProjector = window.location.search.includes('projector=true');
            const [students, setStudents] = useState([]);
            const [syncState, setSyncState] = useState({ view: 'waiting', questionData: null, theme: 'bg-theme-cosmic' });

            useEffect(() => {
                const loadedStudents = JSON.parse(localStorage.getItem('mbr_students') || '[]');
                setStudents(loadedStudents);
                const loadedSync = JSON.parse(localStorage.getItem('mbr_sync') || '{"view":"waiting","questionData":null,"theme":"bg-theme-cosmic"}');
                setSyncState(loadedSync);

                const handleStorage = (e) => {
                    if (e.key === 'mbr_students') setStudents(JSON.parse(e.newValue || '[]'));
                    if (e.key === 'mbr_sync') setSyncState(JSON.parse(e.newValue || '{"view":"waiting","questionData":null,"theme":"bg-theme-cosmic"}'));
                };
                window.addEventListener('storage', handleStorage);
                return () => window.removeEventListener('storage', handleStorage);
            }, []);

            const saveStudents = (newStudents) => {
                setStudents(newStudents);
                localStorage.setItem('mbr_students', JSON.stringify(newStudents));
            };
            const saveSync = (newSync) => {
                setSyncState(newSync);
                localStorage.setItem('mbr_sync', JSON.stringify(newSync));
            };

            if (isProjector) {
                return <ProjectorView syncState={syncState} students={students} />;
            }
            return <TeacherDashboard students={students} saveStudents={saveStudents} syncState={syncState} saveSync={saveSync} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
