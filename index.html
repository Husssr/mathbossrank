<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Boss Rank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800;900&family=Inter:wght@400;600;800;900&family=Cinzel:wght@700;900&family=Orbitron:wght@700;900&family=Rajdhani:wght@700&family=Knewave&family=Chakra+Petch:ital,wght@1,700&family=Bangers&family=Permanent+Marker&family=Anton&family=Russo+One&display=swap');

        body { 
            font-family: 'Inter', 'Sarabun', sans-serif; 
            background-color: #0f172a; 
            color: white; 
            margin: 0; 
            overflow-x: hidden; 
            user-select: none;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Animated Background Themes */
        .bg-theme-cosmic {
            background: linear-gradient(-45deg, #0f172a, #1e3a8a, #312e81, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        .bg-theme-cyberpunk {
            background: linear-gradient(-45deg, #180b2d, #4c1d95, #701a75, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        .bg-theme-emerald {
            background: linear-gradient(-45deg, #022c22, #065f46, #064e3b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        .bg-theme-sunset {
            background: linear-gradient(-45deg, #2a080c, #7c2d12, #831843, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        .bg-theme-freefire {
            background: linear-gradient(-45deg, #1a0800, #7c2d12, #451a03, #0f0a02);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Rank-Up Effect (FreeFire-style) */
        @keyframes rankShake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-6px, 3px); }
            20% { transform: translate(6px, -3px); }
            30% { transform: translate(-5px, -3px); }
            40% { transform: translate(5px, 3px); }
            50% { transform: translate(-4px, 2px); }
            60% { transform: translate(4px, -2px); }
            70% { transform: translate(-3px, 1px); }
            80% { transform: translate(3px, -1px); }
            90% { transform: translate(-2px, 1px); }
        }
        .screen-shake { animation: rankShake 0.5s ease-in-out; }
        @keyframes rankFlash {
            0% { opacity: 0; }
            10% { opacity: 1; }
            100% { opacity: 0; }
        }
        .rankup-flash { animation: rankFlash 0.6s ease-out forwards; }
        @keyframes rankBadgePop {
            0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
            55% { transform: scale(1.15) rotate(4deg); opacity: 1; }
            75% { transform: scale(0.95) rotate(-2deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .rankup-badge { animation: rankBadgePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4) forwards; }
        @keyframes rankSlashLine {
            0% { transform: scaleX(0); opacity: 0.9; }
            60% { transform: scaleX(1); opacity: 0.9; }
            100% { transform: scaleX(1); opacity: 0; }
        }
        .rankup-slash { animation: rankSlashLine 0.7s cubic-bezier(0.6,0,0.2,1) forwards; transform-origin: center; }

        /* Premium rank shine sweep (name pill / badge) */
        .rank-shine { position: relative; overflow: hidden; isolation: isolate; }
        .rank-shine::after {
            content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
            background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.75) 50%, transparent 100%);
            transform: skewX(-20deg);
            animation: shineSweep 2.6s ease-in-out infinite;
        }
        @keyframes shineSweep {
            0% { left: -60%; }
            35% { left: 130%; }
            100% { left: 130%; }
        }
        /* Glowing dimensional backdrop behind rank icons */
        .icon-glow-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
        .icon-glow-wrap::before {
            content: ''; position: absolute; inset: -25%; border-radius: 50%;
            background: radial-gradient(circle, var(--glow-color, rgba(255,255,255,0.5)) 0%, transparent 70%);
            filter: blur(6px); animation: iconGlowPulse 2.4s ease-in-out infinite;
            z-index: 0;
        }
        .icon-glow-wrap > svg { position: relative; z-index: 1; }
        @keyframes iconGlowPulse {
            0%, 100% { opacity: 0.55; transform: scale(0.92); }
            50% { opacity: 1; transform: scale(1.08); }
        }
        /* Sparkle twinkles scattered on premium badges */
        .sparkle-dot { position: absolute; border-radius: 50%; background: #fff; animation: sparkleTwinkle 1.6s ease-in-out infinite; z-index: 2; }
        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            pointer-events: none;
            animation: floatUp infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Spinning Ring */
        .spin-ring {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* One Line Text for Equation */
        .equation-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90vw;
            font-size: clamp(2.5rem, 7vw, 5.5rem);
            font-weight: 900;
            text-shadow: 0 0 25px rgba(59, 130, 246, 0.8);
        }

        /* Premium Rank Name Styles */
        .font-bronze { font-family: 'Bangers', cursive; font-weight: 400; letter-spacing: 1px; }
        .font-silver { font-family: 'Anton', sans-serif; font-style: italic; letter-spacing: 1px; }
        .font-gold { font-family: 'Russo One', sans-serif; }
        .font-plat { font-family: 'Anton', sans-serif; font-style: italic; letter-spacing: 1px; }
        .font-dia { font-family: 'Permanent Marker', cursive; letter-spacing: 0.5px; }
        .font-hero { font-family: 'Bangers', cursive; letter-spacing: 1.5px; }
        .font-master { font-family: 'Permanent Marker', cursive; letter-spacing: 0.5px; }
        .font-gm { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; }
        .font-challenger { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 3px; font-style: italic; }

        .text-animate-bg {
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
            -webkit-text-stroke: 0.6px rgba(0,0,0,0.6);
            paint-order: stroke fill;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.75));
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }
        .rainbow-shine {
            background-image: linear-gradient(90deg, #ff5252, #ffb347, #fff176, #69f0ae, #40c4ff, #b388ff, #ff80ab, #ff5252);
            background-size: 300% auto;
            animation: shine 2.2s linear infinite;
        }
        
        /* Animations */
        .reveal-anim {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .step-anim {
            opacity: 0;
            animation: slideRight 0.4s ease forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideRight {
            0% { transform: translateX(-25px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* Pet Card Grid Styles */
        .pet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            padding: 20px;
        }
        .pet-card {
            background: rgba(10, 10, 20, 0.95);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .pet-card:hover {
            transform: translateY(-8px) scale(1.02);
            z-index: 10;
        }
        .pet-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
            z-index: 1;
        }
        .pet-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 10px;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 2;
            position: relative;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .pet-image-area {
            position: relative;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border-bottom: 2px solid;
            background-size: cover;
            background-position: center;
        }
        .pet-3d-model {
            font-size: 5.5rem;
            animation: floatPet 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.8));
            position: relative;
            z-index: 3;
        }
        .pet-glow-bg {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.6;
            z-index: 1;
            animation: pulseGlow 3s infinite alternate;
        }
        .pet-name-badge {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            padding: 5px 22px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1rem;
            white-space: nowrap;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9);
            border: 2px solid;
        }
        .pet-stats-area {
            padding: 28px 20px 20px;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.4));
        }
        .stat-line {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #e2e8f0;
        }
        .stat-icon {
            width: 20px;
            text-align: center;
            opacity: 0.9;
        }
        .pet-quote {
            margin-top: auto;
            padding-top: 12px;
            text-align: center;
            font-style: italic;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes floatPet {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.8); opacity: 0.4; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Specific Pet Rank Border Classes */
        .card-bronze { border: 2px solid #b45309; box-shadow: 0 0 20px rgba(180,83,9,0.3); }
        .card-silver { border: 2px solid #94a3b8; box-shadow: 0 0 20px rgba(148,163,184,0.3); }
        .card-gold { border: 2px solid #eab308; box-shadow: 0 0 20px rgba(234,179,8,0.3); }
        .card-plat { border: 2px solid #06b6d4; box-shadow: 0 0 20px rgba(6,182,212,0.3); }
        .card-dia { border: 2px solid #3b82f6; box-shadow: 0 0 20px rgba(59,130,246,0.3); }
        .card-hero { border: 2px solid #ef4444; box-shadow: 0 0 20px rgba(239,68,68,0.3); }
        .card-master { border: 2px solid #a855f7; box-shadow: 0 0 20px rgba(168,85,247,0.3); }
        .card-gm { border: 2px solid #f59e0b; box-shadow: 0 0 30px rgba(245,158,11,0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const playTick = (theme) => {
            try { 
                let synth;
                if(theme === 'bg-theme-cyberpunk') {
                    synth = new Tone.Synth({oscillator: {type: "sawtooth"}}).toDestination();
                    synth.triggerAttackRelease("C3", "32n");
                } else if (theme === 'bg-theme-emerald') {
                    synth = new Tone.MembraneSynth().toDestination();
                    synth.triggerAttackRelease("G2", "16n");
                } else if (theme === 'bg-theme-sunset') {
                    synth = new Tone.Synth({oscillator: {type: "triangle"}}).toDestination();
                    synth.triggerAttackRelease("E4", "16n");
                } else if (theme === 'bg-theme-freefire') {
                    synth = new Tone.Synth({oscillator: {type: "square"}}).toDestination();
                    synth.triggerAttackRelease("A5", "32n");
                } else {
                    synth = new Tone.Synth().toDestination(); 
                    synth.triggerAttackRelease("C6", "32n"); 
                }
            } catch (e) {}
        };
        const playEnd = (theme) => {
            try { 
                let synth;
                if(theme === 'bg-theme-cyberpunk') {
                    synth = new Tone.Synth({oscillator: {type: "square"}}).toDestination();
                    synth.triggerAttackRelease("C2", "2n");
                } else if (theme === 'bg-theme-emerald') {
                    synth = new Tone.MembraneSynth().toDestination();
                    synth.triggerAttackRelease("C1", "2n");
                } else if (theme === 'bg-theme-sunset') {
                    synth = new Tone.FMSynth().toDestination();
                    synth.triggerAttackRelease("C3", "2n");
                } else if (theme === 'bg-theme-freefire') {
                    synth = new Tone.MembraneSynth().toDestination();
                    synth.triggerAttackRelease("C2", "4n");
                } else {
                    synth = new Tone.Synth().toDestination(); 
                    synth.triggerAttackRelease("C4", "2n"); 
                }
            } catch (e) {}
        };
        const playSuccess = (theme) => {
            try { 
                let synth;
                if(theme === 'bg-theme-cyberpunk') {
                    synth = new Tone.PolySynth(Tone.Synth, {oscillator: {type: "square"}}).toDestination();
                    synth.triggerAttackRelease(["C3", "E3", "G3", "C4"], "2n");
                } else if (theme === 'bg-theme-emerald') {
                    synth = new Tone.PolySynth(Tone.Synth, {oscillator: {type: "triangle"}}).toDestination();
                    synth.triggerAttackRelease(["C4", "F4", "A4", "C5"], "2n");
                } else if (theme === 'bg-theme-sunset') {
                    synth = new Tone.PolySynth(Tone.AMSynth).toDestination();
                    synth.triggerAttackRelease(["C4", "E4", "G4", "B4"], "2n");
                } else if (theme === 'bg-theme-freefire') {
                    synth = new Tone.PolySynth(Tone.Synth, {oscillator: {type: "sawtooth"}}).toDestination();
                    synth.triggerAttackRelease(["A3", "C4", "E4", "A4"], "2n");
                } else {
                    synth = new Tone.PolySynth(Tone.Synth).toDestination(); 
                    synth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "2n"); 
                }
            } catch (e) {}
        };
        const playRankUp = (theme) => {
            try {
                if (theme === 'bg-theme-freefire') {
                    const s = new Tone.PolySynth(Tone.Synth, {oscillator: {type: "sawtooth"}}).toDestination();
                    s.triggerAttackRelease(["A3", "E4", "A4"], "8n");
                    setTimeout(() => s.triggerAttackRelease(["C4", "F4", "A4", "C5"], "4n"), 140);
                } else if (theme === 'bg-theme-cyberpunk') {
                    const s = new Tone.PolySynth(Tone.Synth, {oscillator: {type: "square"}}).toDestination();
                    s.triggerAttackRelease(["E3", "G3", "B3"], "8n");
                    setTimeout(() => s.triggerAttackRelease(["C4", "E4", "G4", "C5"], "4n"), 140);
                } else if (theme === 'bg-theme-emerald') {
                    const s = new Tone.PolySynth(Tone.Synth, {oscillator: {type: "triangle"}}).toDestination();
                    s.triggerAttackRelease(["G3", "C4", "E4"], "8n");
                    setTimeout(() => s.triggerAttackRelease(["F4", "A4", "C5"], "4n"), 140);
                } else if (theme === 'bg-theme-sunset') {
                    const s = new Tone.PolySynth(Tone.AMSynth).toDestination();
                    s.triggerAttackRelease(["E3", "G3", "B3"], "8n");
                    setTimeout(() => s.triggerAttackRelease(["C4", "E4", "G4", "B4"], "4n"), 140);
                } else {
                    const s = new Tone.PolySynth(Tone.Synth).toDestination();
                    s.triggerAttackRelease(["C4", "E4", "G4"], "8n");
                    setTimeout(() => s.triggerAttackRelease(["D4", "G4", "B4", "D5"], "4n"), 140);
                }
            } catch (e) {}
        };

        const getRankInfo = (score) => {
            if (score >= 800) return { 
                name: 'Challenger', bg: 'bg-gradient-to-r from-yellow-500 via-amber-400 to-yellow-600', text: 'text-white', glow: 'shadow-[0_0_20px_rgba(245,158,11,0.8)]', border: 'border-yellow-400',
                nameStyle: 'rainbow-shine text-animate-bg font-challenger drop-shadow-[0_0_14px_rgba(255,255,255,0.85)]'
            };
            if (score >= 550) return { 
                name: 'Grandmaster', bg: 'bg-gradient-to-r from-red-700 to-rose-900', text: 'text-white', glow: 'shadow-[0_0_20px_rgba(225,29,72,0.8)]', border: 'border-red-500',
                nameStyle: 'bg-gradient-to-r from-yellow-100 via-amber-400 to-yellow-500 text-animate-bg font-hero drop-shadow-[0_0_12px_rgba(250,204,21,0.85)]'
            };
            if (score >= 350) return { 
                name: 'Master', bg: 'bg-gradient-to-r from-purple-700 to-fuchsia-600', text: 'text-white', glow: 'shadow-[0_0_20px_rgba(192,38,211,0.8)]', border: 'border-fuchsia-400',
                nameStyle: 'bg-gradient-to-r from-fuchsia-300 via-purple-400 to-fuchsia-300 text-animate-bg font-master drop-shadow-[0_0_10px_rgba(192,38,211,0.8)]'
            };
            if (score >= 200) return { 
                name: 'Diamond', bg: 'bg-gradient-to-r from-blue-600 to-indigo-500', text: 'text-white', glow: 'shadow-[0_0_20px_rgba(59,130,246,0.8)]', border: 'border-blue-400',
                nameStyle: 'bg-gradient-to-r from-cyan-300 via-blue-400 to-cyan-300 text-animate-bg font-dia drop-shadow-[0_0_10px_rgba(59,130,246,0.8)]'
            };
            if (score >= 100) return { 
                name: 'Platinum', bg: 'bg-gradient-to-r from-cyan-500 to-teal-400', text: 'text-white', glow: 'shadow-[0_0_20px_rgba(6,182,212,0.8)]', border: 'border-cyan-300',
                nameStyle: 'bg-gradient-to-r from-teal-200 via-cyan-300 to-teal-200 text-animate-bg font-plat drop-shadow-[0_0_5px_rgba(6,182,212,0.5)]'
            };
            if (score >= 50) return { 
                name: 'Gold', bg: 'bg-gradient-to-r from-yellow-400 to-amber-500', text: 'text-black', glow: 'shadow-[0_0_20px_rgba(234,179,8,0.8)]', border: 'border-yellow-400',
                nameStyle: 'bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-200 text-animate-bg font-gold'
            };
            if (score >= 20) return { 
                name: 'Silver', bg: 'bg-gradient-to-r from-slate-300 to-gray-400', text: 'text-black', glow: 'shadow-[0_0_20px_rgba(148,163,184,0.8)]', border: 'border-slate-300',
                nameStyle: 'bg-gradient-to-r from-gray-200 via-slate-400 to-gray-200 text-animate-bg font-silver'
            };
            return { 
                name: 'Bronze', bg: 'bg-gradient-to-r from-amber-700 to-orange-800', text: 'text-white', glow: 'shadow-[0_0_20px_rgba(180,83,9,0.8)]', border: 'border-amber-600',
                nameStyle: 'bg-gradient-to-r from-orange-300 via-amber-500 to-orange-300 text-animate-bg font-bronze'
            };
        };

        const RankIcon = ({ name, className }) => {
            let bgGrad, gemGrad, styleType;
            switch(name) {
                case 'Bronze': bgGrad="url(#grad-bronze)"; gemGrad="url(#grad-bronze-gem)"; styleType='small'; break;
                case 'Silver': bgGrad="url(#grad-silver)"; gemGrad="url(#grad-silver-gem)"; styleType='small'; break;
                case 'Gold': bgGrad="url(#grad-gold)"; gemGrad="url(#grad-gold-gem)"; styleType='flare'; break;
                case 'Platinum': bgGrad="url(#grad-plat)"; gemGrad="url(#grad-plat-gem)"; styleType='flare'; break;
                case 'Diamond': bgGrad="url(#grad-dia)"; gemGrad="url(#grad-dia-gem)"; styleType='crystal'; break;
                case 'Master': bgGrad="url(#grad-master)"; gemGrad="url(#grad-master-gem)"; styleType='crownSmall'; break;
                case 'Grandmaster': bgGrad="url(#grad-hero)"; gemGrad="url(#grad-hero-gem)"; styleType='aggressive'; break;
                case 'Challenger': bgGrad="url(#grad-gold)"; gemGrad="url(#grad-gm-gem)"; styleType='crownBig'; break;
                default: bgGrad="url(#grad-bronze)"; gemGrad="url(#grad-bronze-gem)"; styleType='small';
            }
            const bigWings = styleType === 'aggressive' || styleType === 'crownBig';
            const hasCrown = styleType === 'crownSmall' || styleType === 'crownBig';
            const spikeLevel = { small: 1, flare: 2, crystal: 2, crownSmall: 3, aggressive: 3, crownBig: 3 }[styleType];

            return (
                <svg viewBox="0 0 100 100" className={className} xmlns="http://www.w3.org/2000/svg" style={{filter: 'drop-shadow(0px 4px 6px rgba(0,0,0,0.5))'}}>
                    <defs>
                        <linearGradient id="grad-bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#e0a06a"/><stop offset="100%" stopColor="#7a3d15"/></linearGradient>
                        <linearGradient id="grad-bronze-gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#ffd9a8"/><stop offset="100%" stopColor="#a0522d"/></linearGradient>
                        <linearGradient id="grad-silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#ffffff"/><stop offset="100%" stopColor="#8a8a8a"/></linearGradient>
                        <linearGradient id="grad-silver-gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#ffffff"/><stop offset="100%" stopColor="#b8c2cc"/></linearGradient>
                        <linearGradient id="grad-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#fff3a0"/><stop offset="100%" stopColor="#b8790a"/></linearGradient>
                        <linearGradient id="grad-gold-gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#fffbd6"/><stop offset="100%" stopColor="#e6a817"/></linearGradient>
                        <linearGradient id="grad-plat" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#e6ffff"/><stop offset="100%" stopColor="#0d9aa3"/></linearGradient>
                        <linearGradient id="grad-plat-gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#ffffff"/><stop offset="100%" stopColor="#3fd6e0"/></linearGradient>
                        <linearGradient id="grad-dia" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#c7e2ff"/><stop offset="100%" stopColor="#1d4fd8"/></linearGradient>
                        <linearGradient id="grad-dia-gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#ffffff"/><stop offset="100%" stopColor="#5b8cff"/></linearGradient>
                        <linearGradient id="grad-hero" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#ff5252"/><stop offset="60%" stopColor="#7a0d0d"/><stop offset="100%" stopColor="#1a0505"/></linearGradient>
                        <linearGradient id="grad-hero-gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#ffb3b3"/><stop offset="100%" stopColor="#c81e1e"/></linearGradient>
                        <linearGradient id="grad-master" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#e6b8ff"/><stop offset="100%" stopColor="#6a1b9a"/></linearGradient>
                        <linearGradient id="grad-master-gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#f6e6ff"/><stop offset="100%" stopColor="#b565e8"/></linearGradient>
                        <linearGradient id="grad-gm-gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#fff6cc"/><stop offset="100%" stopColor="#3fa9ff"/></linearGradient>
                        <linearGradient id="grad-wing-light" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#ffffff"/><stop offset="100%" stopColor="#9aa5b1"/></linearGradient>
                        <linearGradient id="grad-wing-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#4a4a4a"/><stop offset="100%" stopColor="#0a0a0a"/></linearGradient>
                    </defs>
                    <g>
                        {/* Outer back-wings for the two top tiers */}
                        {bigWings && (
                            <g fill={styleType === 'aggressive' ? 'url(#grad-wing-dark)' : 'url(#grad-wing-light)'} stroke={styleType === 'aggressive' ? '#000' : '#fff'} strokeWidth="0.5">
                                <polygon points="22,48 -5,10 8,42 -8,38 12,62 0,58 20,78" />
                                <polygon points="78,48 105,10 92,42 108,38 88,62 100,58 80,78" />
                            </g>
                        )}
                        {/* Shield backdrop */}
                        <polygon points="50,8 88,28 77,76 50,96 23,76 12,28" fill="rgba(0,0,0,0.35)" />
                        <polygon points="50,13 85,31 74,73 50,91 26,73 15,31" fill={bgGrad} stroke={bigWings ? '#fff' : 'none'} strokeWidth={bigWings ? 1 : 0} />
                        <polygon points="50,20 76,34 67,67 50,80 33,67 24,34" fill="rgba(0,0,0,0.22)" />

                        {/* Side spikes — get bigger/more numerous with tier */}
                        <g fill={bgGrad} stroke="rgba(0,0,0,0.25)" strokeWidth="0.3">
                            <polygon points="15,38 3,42 17,53" />
                            <polygon points="85,38 97,42 83,53" />
                            {spikeLevel >= 2 && (<>
                                <polygon points="17,26 6,20 23,33" />
                                <polygon points="83,26 94,20 77,33" />
                            </>)}
                            {spikeLevel >= 3 && (<>
                                <polygon points="22,16 13,8 29,22" />
                                <polygon points="78,16 87,8 71,22" />
                            </>)}
                        </g>

                        {/* Central faceted gem */}
                        <g>
                            <polygon points="50,30 67,48 50,74 33,48" fill={gemGrad} stroke="rgba(255,255,255,0.6)" strokeWidth="0.6"/>
                            <polygon points="50,30 50,74 33,48" fill="rgba(0,0,0,0.18)" />
                            <polygon points="50,30 58,40 50,50 42,40" fill="rgba(255,255,255,0.75)" />
                            <polygon points="42,40 50,50 45,62 33,48" fill="rgba(255,255,255,0.15)" />
                        </g>

                        {/* Crown for Master & Challenger */}
                        {hasCrown && (
                            <path d="M 34,15 L 40,3 L 50,12 L 60,3 L 66,15 L 60,12 L 50,17 L 40,12 Z" fill={styleType === 'crownBig' ? 'url(#grad-gold)' : gemGrad} stroke="#fff" strokeWidth="0.6"/>
                        )}
                    </g>
                </svg>
            );
        };

        const generateEquation = (gradeStr, diffLevelStr) => {
            const diffMap = { "ง่าย": 1, "ปานกลาง": 2, "ยาก": 3, "ยากมาก": 4 };
            const difficulty = diffMap[diffLevelStr] || 1;
            const gradeLevel = parseInt(gradeStr.replace('ป.', '')) || 1;
            const f = (num) => num.toLocaleString('en-US');
            const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const pick = (patterns) => patterns[Math.floor(Math.random() * patterns.length)]();

            // Grade tiers: A = ป.1-2 (บวก-ลบเท่านั้น), B = ป.3-4 (เริ่มคูณ-หาร), C = ป.5-6 (ตัวเลขใหญ่ขึ้น)
            const tier = gradeLevel <= 2 ? 'A' : (gradeLevel <= 4 ? 'B' : 'C');

            // ================= TIER A: ป.1 - ป.2 =================
            if (tier === 'A') {
                if (difficulty === 1) { // ง่าย: บวก-ลบ เลขหลักหน่วยถึงสิบต้นๆ ทีละขั้นตอนเดียว
                    return pick([
                        () => { const a = rnd(1, 9), b = rnd(1, 9); return { question: `${a} + ${b}`, answer: f(a + b), steps: [`บวกจำนวนทั้งสอง: ${a} + ${b} = ${a + b}`] }; },
                        () => { const a = rnd(10, 20), b = rnd(1, 9); return { question: `${a} + ${b}`, answer: f(a + b), steps: [`บวกหลักหน่วยแล้วรวมกับหลักสิบ: ${a} + ${b} = ${a + b}`] }; },
                        () => { const a = rnd(5, 20), b = rnd(1, a - 1); return { question: `${a} - ${b}`, answer: f(a - b), steps: [`ลบจำนวนทั้งสอง: ${a} - ${b} = ${a - b}`] }; },
                        () => { const a = rnd(10, 18), b = rnd(1, 9); return { question: `${a} - ${b}`, answer: f(a - b), steps: [`ลบหลักหน่วยออกจากจำนวน: ${a} - ${b} = ${a - b}`] }; },
                    ]);
                }
                if (difficulty === 2) { // ปานกลาง: ตัวเลขโตขึ้น เริ่มมีการทด/ยืม และบวก-ลบ 3 จำนวน
                    return pick([
                        () => { const a = rnd(10, 45), b = rnd(10, 45); return { question: `${a} + ${b}`, answer: f(a + b), steps: [`บวกหลักหน่วยก่อน แล้วบวกหลักสิบ: ${a} + ${b} = ${a + b}`] }; },
                        () => { const a = rnd(20, 60), b = rnd(1, a - 1); return { question: `${a} - ${b}`, answer: f(a - b), steps: [`ลบหลักหน่วย (ยืมถ้าจำเป็น) แล้วลบหลักสิบ: ${a} - ${b} = ${a - b}`] }; },
                        () => { const a = rnd(5, 15), b = rnd(5, 15), c = rnd(1, 10), s = a + b; return { question: `${a} + ${b} - ${c}`, answer: f(s - c), steps: [`ขั้นที่ 1: บวกก่อน ${a} + ${b} = ${s}`, `ขั้นที่ 2: นำมาลบ ${s} - ${c} = ${s - c}`] }; },
                        () => { const a = rnd(20, 45), b = rnd(5, 20), c = rnd(1, 15), s = a - b; return { question: `${a} - ${b} + ${c}`, answer: f(s + c), steps: [`ขั้นที่ 1: ลบก่อน ${a} - ${b} = ${s}`, `ขั้นที่ 2: นำมาบวก ${s} + ${c} = ${s + c}`] }; },
                    ]);
                }
                if (difficulty === 3) { // ยาก: เลขหลักสิบเต็ม ต้องทด/ยืมแน่นอน และเริ่มมี 3 จำนวนบวกวงเล็บ
                    return pick([
                        () => { const a = rnd(40, 90), b = rnd(40, 90); return { question: `${a} + ${b}`, answer: f(a + b), steps: [`ทดหลักสิบถ้าจำเป็น แล้วบวก: ${a} + ${b} = ${a + b}`] }; },
                        () => { const a = rnd(50, 100), b = rnd(1, a - 1); return { question: `${a} - ${b}`, answer: f(a - b), steps: [`ยืมหลักสิบมาลบหลักหน่วยถ้าจำเป็น: ${a} - ${b} = ${a - b}`] }; },
                        () => { const a = rnd(10, 30), b = rnd(10, 30), c = rnd(10, 30), s = a + b; return { question: `${a} + ${b} + ${c}`, answer: f(s + c), steps: [`ขั้นที่ 1: บวกสองจำนวนแรก ${a} + ${b} = ${s}`, `ขั้นที่ 2: บวกจำนวนที่สาม ${s} + ${c} = ${s + c}`] }; },
                        () => { const a = rnd(60, 99), b = rnd(10, 40), c = rnd(1, 30), s = a - b; return { question: `${a} - ${b} - ${c}`, answer: f(s - c), steps: [`ขั้นที่ 1: ลบครั้งแรก ${a} - ${b} = ${s}`, `ขั้นที่ 2: ลบครั้งที่สอง ${s} - ${c} = ${s - c}`] }; },
                        () => { const a = rnd(20, 50), b = rnd(20, 50), c = rnd(5, 25), s = a + b; return { question: `(${a} + ${b}) - ${c}`, answer: f(s - c), steps: [`ขั้นที่ 1: ทำในวงเล็บก่อน ${a} + ${b} = ${s}`, `ขั้นที่ 2: นำมาลบ ${s} - ${c} = ${s - c}`] }; },
                    ]);
                }
                // ยากมาก: เลขหลักร้อย และโจทย์ 3 ขั้นตอน
                return pick([
                    () => { const a = rnd(100, 200), b = rnd(100, 200); return { question: `${a} + ${b}`, answer: f(a + b), steps: [`บวกเลขสามหลัก: ${a} + ${b} = ${a + b}`] }; },
                    () => { const a = rnd(150, 300), b = rnd(1, a - 1); return { question: `${a} - ${b}`, answer: f(a - b), steps: [`ลบเลขสามหลัก (ยืมหลายหลักถ้าจำเป็น): ${a} - ${b} = ${a - b}`] }; },
                    () => { const a = rnd(30, 80), b = rnd(30, 80), c = rnd(10, 50), d = rnd(5, 30), s1 = a + b, s2 = s1 - c; return { question: `${a} + ${b} - ${c} + ${d}`, answer: f(s2 + d), steps: [`ขั้นที่ 1: ${a} + ${b} = ${s1}`, `ขั้นที่ 2: ${s1} - ${c} = ${s2}`, `ขั้นที่ 3: ${s2} + ${d} = ${s2 + d}`] }; },
                    () => { const a = rnd(80, 150), b = rnd(20, 60), c = rnd(20, 60), s = a - b; return { question: `(${a} - ${b}) + ${c}`, answer: f(s + c), steps: [`ขั้นที่ 1: ทำในวงเล็บก่อน ${a} - ${b} = ${s}`, `ขั้นที่ 2: นำมาบวก ${s} + ${c} = ${s + c}`] }; },
                ]);
            }

            // ================= TIER B: ป.3 - ป.4 =================
            if (tier === 'B') {
                if (difficulty === 1) { // ง่าย: การคำนวณขั้นตอนเดียว ตัวเลขเล็ก
                    return pick([
                        () => { const a = rnd(10, 50), b = rnd(10, 50); return { question: `${a} + ${b}`, answer: f(a + b), steps: [`บวกตรงๆ: ${a} + ${b} = ${a + b}`] }; },
                        () => { const a = rnd(20, 80), b = rnd(1, a - 1); return { question: `${a} - ${b}`, answer: f(a - b), steps: [`ลบตรงๆ: ${a} - ${b} = ${a - b}`] }; },
                        () => { const a = rnd(2, 9), b = rnd(2, 9); return { question: `${a} × ${b}`, answer: f(a * b), steps: [`ท่องสูตรคูณ: ${a} × ${b} = ${a * b}`] }; },
                        () => { const b = rnd(2, 9), ans = rnd(2, 9), a = b * ans; return { question: `${a} ÷ ${b}`, answer: f(ans), steps: [`หารตรงๆ: ${a} ÷ ${b} = ${ans}`] }; },
                    ]);
                }
                if (difficulty === 2) { // ปานกลาง: ตัวเลขโตขึ้น เริ่มมีคูณเลขสองหลัก และบวกลบ 3 จำนวน
                    return pick([
                        () => { const a = rnd(50, 150), b = rnd(50, 150); return { question: `${a} + ${b}`, answer: f(a + b), steps: [`บวกเลขสองสามหลัก: ${a} + ${b} = ${a + b}`] }; },
                        () => { const a = rnd(80, 200), b = rnd(1, a - 1); return { question: `${a} - ${b}`, answer: f(a - b), steps: [`ลบเลขสองสามหลัก: ${a} - ${b} = ${a - b}`] }; },
                        () => { const a = rnd(10, 25), b = rnd(2, 9); return { question: `${a} × ${b}`, answer: f(a * b), steps: [`คูณเลขสองหลักกับหลักเดียว: ${a} × ${b} = ${a * b}`] }; },
                        () => { const b = rnd(2, 12), ans = rnd(5, 15), a = b * ans; return { question: `${a} ÷ ${b}`, answer: f(ans), steps: [`หารเลข: ${a} ÷ ${b} = ${ans}`] }; },
                        () => { const a = rnd(5, 15), b = rnd(5, 15), c = rnd(5, 15), s = a + b; return { question: `${a} + ${b} + ${c}`, answer: f(s + c), steps: [`ขั้นที่ 1: ${a} + ${b} = ${s}`, `ขั้นที่ 2: ${s} + ${c} = ${s + c}`] }; },
                    ]);
                }
                if (difficulty === 3) { // ยาก: โจทย์ 2 ขั้นตอน ผสมวงเล็บ
                    return pick([
                        () => { const a = rnd(2, 12), b = rnd(2, 12), c = rnd(2, 12), d = rnd(2, 12), ab = a * b, cd = c * d; return { question: `(${a} × ${b}) + (${c} × ${d})`, answer: f(ab + cd), steps: [`ขั้นที่ 1: (${a} × ${b}) = ${ab}`, `ขั้นที่ 2: (${c} × ${d}) = ${cd}`, `ขั้นที่ 3: บวกกัน ${ab} + ${cd} = ${ab + cd}`] }; },
                        () => { const a = rnd(10, 30), b = rnd(2, 9), c = rnd(5, 40), ab = a * b; return { question: `(${a} × ${b}) - ${c}`, answer: f(ab - c), steps: [`ขั้นที่ 1: (${a} × ${b}) = ${ab}`, `ขั้นที่ 2: ลบ ${c}: ${ab} - ${c} = ${ab - c}`] }; },
                        () => { const b = rnd(2, 9), ans = rnd(3, 12), c = rnd(2, 10), a = b * ans; return { question: `(${a} ÷ ${b}) + ${c}`, answer: f(ans + c), steps: [`ขั้นที่ 1: (${a} ÷ ${b}) = ${ans}`, `ขั้นที่ 2: บวก ${c}: ${ans} + ${c} = ${ans + c}`] }; },
                        () => { const a = rnd(2, 9), b = rnd(2, 9), c = rnd(2, 9), ab = a * b; return { question: `${a} × ${b} × ${c}`, answer: f(ab * c), steps: [`ขั้นที่ 1: ${a} × ${b} = ${ab}`, `ขั้นที่ 2: ${ab} × ${c} = ${ab * c}`] }; },
                        () => { const a = rnd(20, 50), b = rnd(20, 50), c = rnd(2, 9), s = a + b; return { question: `(${a} + ${b}) × ${c}`, answer: f(s * c), steps: [`ขั้นที่ 1: ทำวงเล็บก่อน ${a} + ${b} = ${s}`, `ขั้นที่ 2: คูณด้วย ${c}: ${s} × ${c} = ${s * c}`] }; },
                    ]);
                }
                // ยากมาก: โจทย์หลายขั้นตอน ตัวเลขใหญ่ขึ้น
                return pick([
                    () => { const a = rnd(3, 15), b = rnd(3, 15), c = rnd(3, 15), d = rnd(3, 15), ab = a * b, cd = c * d; return { question: `(${a} × ${b}) + (${c} × ${d})`, answer: f(ab + cd), steps: [`ขั้นที่ 1: (${a} × ${b}) = ${ab}`, `ขั้นที่ 2: (${c} × ${d}) = ${cd}`, `ขั้นที่ 3: บวกกัน ${ab} + ${cd} = ${ab + cd}`] }; },
                    () => {
                        const ans = rnd(3, 12), d = rnd(2, 9), top = ans * d;
                        let a = rnd(6, 15), b = rnd(6, 15);
                        while (a * b <= top) { a++; b++; }
                        const ab = a * b, c = ab - top;
                        return { question: `((${a} × ${b}) - ${c}) ÷ ${d}`, answer: f(ans), steps: [`ขั้นที่ 1: (${a} × ${b}) = ${ab}`, `ขั้นที่ 2: (${ab} - ${c}) = ${top}`, `ขั้นที่ 3: ${top} ÷ ${d} = ${ans}`] };
                    },
                    () => { const b = rnd(2, 9), ans1 = rnd(3, 12), a = ans1 * b, c = rnd(10, 30), d = rnd(10, 30), ans2 = c + d; return { question: `(${a} ÷ ${b}) × (${c} + ${d})`, answer: f(ans1 * ans2), steps: [`ขั้นที่ 1: (${a} ÷ ${b}) = ${ans1}`, `ขั้นที่ 2: (${c} + ${d}) = ${ans2}`, `ขั้นที่ 3: คูณกัน ${ans1} × ${ans2} = ${ans1 * ans2}`] }; },
                    () => { const a = rnd(4, 12), b = rnd(4, 12), c = rnd(4, 12), d = rnd(5, 20), ab = a * b; return { question: `(${a} × ${b}) - (${c} + ${d})`, answer: f(ab - (c + d)), steps: [`ขั้นที่ 1: (${a} × ${b}) = ${ab}`, `ขั้นที่ 2: (${c} + ${d}) = ${c + d}`, `ขั้นที่ 3: ${ab} - ${c + d} = ${ab - (c + d)}`] }; },
                ]);
            }

            // ================= TIER C: ป.5 - ป.6 =================
            if (difficulty === 1) { // ง่าย: คำนวณขั้นตอนเดียว
                return pick([
                    () => { const a = rnd(50, 300), b = rnd(50, 300); return { question: `${a} + ${b}`, answer: f(a + b), steps: [`บวกตรงๆ: ${a} + ${b} = ${a + b}`] }; },
                    () => { const a = rnd(100, 400), b = rnd(1, a - 1); return { question: `${a} - ${b}`, answer: f(a - b), steps: [`ลบตรงๆ: ${a} - ${b} = ${a - b}`] }; },
                    () => { const a = rnd(2, 12), b = rnd(2, 12); return { question: `${a} × ${b}`, answer: f(a * b), steps: [`ท่องสูตรคูณ: ${a} × ${b} = ${a * b}`] }; },
                    () => { const b = rnd(2, 12), ans = rnd(2, 12), a = b * ans; return { question: `${a} ÷ ${b}`, answer: f(ans), steps: [`หารตรงๆ: ${a} ÷ ${b} = ${ans}`] }; },
                ]);
            }
            if (difficulty === 2) { // ปานกลาง: เลขสองหลักคูณกัน หารเลขโต และโจทย์ 2 ขั้นตอนง่ายๆ
                return pick([
                    () => { const a = rnd(12, 40), b = rnd(12, 40); return { question: `${a} × ${b}`, answer: f(a * b), steps: [`คูณเลขสองหลัก: ${a} × ${b} = ${a * b}`] }; },
                    () => { const b = rnd(5, 20), ans = rnd(10, 40), a = b * ans; return { question: `${a} ÷ ${b}`, answer: f(ans), steps: [`หารเลขสองหลัก: ${a} ÷ ${b} = ${ans}`] }; },
                    () => { const a = rnd(200, 600), b = rnd(200, 600); return { question: `${a} + ${b}`, answer: f(a + b), steps: [`บวกเลขสามหลัก: ${a} + ${b} = ${a + b}`] }; },
                    () => { const a = rnd(300, 800), b = rnd(1, a - 1); return { question: `${a} - ${b}`, answer: f(a - b), steps: [`ลบเลขสามหลัก: ${a} - ${b} = ${a - b}`] }; },
                    () => { const a = rnd(5, 20), b = rnd(5, 20), c = rnd(2, 9), s = a + b; return { question: `(${a} + ${b}) × ${c}`, answer: f(s * c), steps: [`ขั้นที่ 1: ${a} + ${b} = ${s}`, `ขั้นที่ 2: ${s} × ${c} = ${s * c}`] }; },
                ]);
            }
            if (difficulty === 3) { // ยาก: โจทย์ 2-3 ขั้นตอนผสมวงเล็บ ตัวเลขใหญ่ขึ้น
                return pick([
                    () => { const a = rnd(5, 20), b = rnd(5, 20), c = rnd(5, 20), d = rnd(5, 20), ab = a * b, cd = c * d; return { question: `(${a} × ${b}) + (${c} × ${d})`, answer: f(ab + cd), steps: [`ขั้นที่ 1: (${a} × ${b}) = ${ab}`, `ขั้นที่ 2: (${c} × ${d}) = ${cd}`, `ขั้นที่ 3: บวกกัน ${ab} + ${cd} = ${ab + cd}`] }; },
                    () => {
                        const ans = rnd(4, 15), d = rnd(2, 10), top = ans * d;
                        let a = rnd(8, 20), b = rnd(8, 20);
                        while (a * b <= top) { a++; b++; }
                        const ab = a * b, c = ab - top;
                        return { question: `((${a} × ${b}) - ${c}) ÷ ${d}`, answer: f(ans), steps: [`ขั้นที่ 1: (${a} × ${b}) = ${ab}`, `ขั้นที่ 2: (${ab} - ${c}) = ${top}`, `ขั้นที่ 3: ${top} ÷ ${d} = ${ans}`] };
                    },
                    () => { const b = rnd(2, 10), ans1 = rnd(4, 15), a = ans1 * b, c = rnd(10, 40), d = rnd(10, 40), ans2 = c + d; return { question: `(${a} ÷ ${b}) × (${c} + ${d})`, answer: f(ans1 * ans2), steps: [`ขั้นที่ 1: (${a} ÷ ${b}) = ${ans1}`, `ขั้นที่ 2: (${c} + ${d}) = ${ans2}`, `ขั้นที่ 3: คูณกัน ${ans1} × ${ans2} = ${ans1 * ans2}`] }; },
                    () => { const a = rnd(15, 40), b = rnd(15, 40), c = rnd(2, 9), d = rnd(5, 30), s = a - b; return { question: `(${a} - ${b}) × ${c} + ${d}`, answer: f(s * c + d), steps: [`ขั้นที่ 1: ${a} - ${b} = ${s}`, `ขั้นที่ 2: ${s} × ${c} = ${s * c}`, `ขั้นที่ 3: ${s * c} + ${d} = ${s * c + d}`] }; },
                    () => { const a = rnd(4, 12), b = rnd(4, 12), c = rnd(4, 12), bc = b + c; return { question: `${a} × (${b} + ${c})`, answer: f(a * bc), steps: [`ขั้นที่ 1: ${b} + ${c} = ${bc}`, `ขั้นที่ 2: ${a} × ${bc} = ${a * bc}`] }; },
                ]);
            }
            // ยากมาก: โจทย์ 3-4 ขั้นตอน ตัวเลขใหญ่ที่สุด
            return pick([
                () => { const a = rnd(8, 25), b = rnd(8, 25), c = rnd(8, 25), d = rnd(8, 25), e = rnd(5, 50), ab = a * b, cd = c * d, sum = ab + cd; return { question: `(${a} × ${b}) + (${c} × ${d}) - ${e}`, answer: f(sum - e), steps: [`ขั้นที่ 1: (${a} × ${b}) = ${ab}`, `ขั้นที่ 2: (${c} × ${d}) = ${cd}`, `ขั้นที่ 3: บวกกัน ${ab} + ${cd} = ${sum}`, `ขั้นที่ 4: ลบ ${e}: ${sum} - ${e} = ${sum - e}`] }; },
                () => {
                    const ans = rnd(5, 20), d = rnd(2, 12), top = ans * d;
                    let a = rnd(10, 25), b = rnd(10, 25);
                    while (a * b <= top) { a++; b++; }
                    const ab = a * b, c = ab - top;
                    return { question: `((${a} × ${b}) - ${c}) ÷ ${d}`, answer: f(ans), steps: [`ขั้นที่ 1: (${a} × ${b}) = ${ab}`, `ขั้นที่ 2: (${ab} - ${c}) = ${top}`, `ขั้นที่ 3: ${top} ÷ ${d} = ${ans}`] };
                },
                () => { const b = rnd(2, 12), ans1 = rnd(5, 20), a = ans1 * b, c = rnd(20, 60), d = rnd(20, 60), e = rnd(5, 40), ans2 = c + d; return { question: `(${a} ÷ ${b}) × (${c} + ${d}) - ${e}`, answer: f(ans1 * ans2 - e), steps: [`ขั้นที่ 1: (${a} ÷ ${b}) = ${ans1}`, `ขั้นที่ 2: (${c} + ${d}) = ${ans2}`, `ขั้นที่ 3: คูณกัน ${ans1} × ${ans2} = ${ans1 * ans2}`, `ขั้นที่ 4: ลบ ${e}: ${ans1 * ans2} - ${e} = ${ans1 * ans2 - e}`] }; },
                () => { const a = rnd(5, 15), b = rnd(5, 15), c = rnd(5, 15), d = rnd(5, 15), bc = b + c; return { question: `${a} × (${b} + ${c}) - ${d}`, answer: f(a * bc - d), steps: [`ขั้นที่ 1: ${b} + ${c} = ${bc}`, `ขั้นที่ 2: ${a} × ${bc} = ${a * bc}`, `ขั้นที่ 3: ลบ ${d}: ${a * bc} - ${d} = ${a * bc - d}`] }; },
